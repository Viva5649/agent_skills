<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多入口与能力适配 · 架构图示例</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f5f6; --panel: #ffffff; --ink: #17212b; --muted: #5b6874;
      --line: #c9d1d8; --line-strong: #7d8b98; --neutral-chip: #eef1f3;
      --blue: #1d5fb8; --blue-bg: #f0f5fc; --blue-chip: #dce8f8;
      --purple: #7048b0; --purple-bg: #f5f1fb; --purple-chip: #e6ddf5;
      --green: #2f7d4a; --green-bg: #f1f8f3; --green-chip: #dcefe2;
      --gold: #8a6a0a; --gold-bg: #fff4d6; --gold-chip: #f4e8b3;
      --red: #b0405e; --red-bg: #fcf1f4; --red-chip: #f6dbe3;
      --teal: #0f766e; --teal-bg: #edf7f5; --teal-chip: #d2eae5;
      --orange: #c2410c; --orange-bg: #fff3eb; --orange-chip: #ffdfc8;
      --grey: #5b6570; --grey-bg: #eceff2; --grey-chip: #dce2e7;
      --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #11161b; --panel: #182028; --ink: #e4e9ee; --muted: #97a4b0;
      --line: #2d3a46; --line-strong: #6b7c8b; --neutral-chip: #1f2931;
      --blue: #7fb0f0; --blue-bg: #152131; --blue-chip: #1d3350;
      --purple: #b69af0; --purple-bg: #1f1a2d; --purple-chip: #332850;
      --green: #72c48f; --green-bg: #16241c; --green-chip: #1f3a29;
      --gold: #d9bd59; --gold-bg: #28220f; --gold-chip: #433916;
      --red: #f08aa5; --red-bg: #2a161c; --red-chip: #4a2430;
      --teal: #5ecfc2; --teal-bg: #152824; --teal-chip: #20443e;
      --orange: #fb923c; --orange-bg: #2b1c12; --orange-chip: #4a2b18;
      --grey: #a7b1bc; --grey-bg: #1d2329; --grey-chip: #293641;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 32px; background: var(--page); color: var(--ink); font-family: var(--font-body); }
    .arch-document { max-width: 1440px; margin: 0 auto; }
    h1 { margin: 0 0 14px; font-size: 1.375rem; font-weight: 700; line-height: 1.5; }
    figure { margin: 0; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .legend { display: flex; flex-direction: column; gap: 8px; margin: 16px 16px 40px; color: var(--muted); font-size: 0.8125rem; line-height: 1.7; }
    .legend-row { display: flex; align-items: center; gap: 12px; }
    .legend-symbol { display: flex; align-items: center; justify-content: center; width: 52px; height: 18px; flex: 0 0 52px; }
    .legend-swatch { width: 32px; height: 18px; border: 1.5px solid var(--module-color); border-radius: 4px; background: var(--module-bg); }
    .legend-duty .legend-swatch { border: 0; background: var(--module-chip); }
    .legend-line { fill: none; stroke: var(--edge); stroke-width: var(--edge-width); stroke-dasharray: var(--edge-dash, none); }
    .legend-arrow { fill: var(--edge); }
    .diagram-scroll { overflow-x: auto; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .architecture { display: block; width: 100%; min-width: 1400px; height: auto; }
    figcaption { margin-top: 14px; color: var(--muted); font-size: 0.8125rem; line-height: 1.8; overflow-wrap: anywhere; }
    .architecture text { fill: var(--ink); font-family: var(--font-body); font-size: 12px; }
    /* 仅为通用示例定义模块映射；实际绘图按本组图的模块重建。 */
    .module-entry, .module-application { --module-color: var(--red); --module-bg: var(--red-bg); --module-chip: var(--red-chip); }
    .module-orchestration, .module-analysis { --module-color: var(--purple); --module-bg: var(--purple-bg); --module-chip: var(--purple-chip); }
    .module-execution { --module-color: var(--blue); --module-bg: var(--blue-bg); --module-chip: var(--blue-chip); }
    .module-adapter { --module-color: var(--gold); --module-bg: var(--gold-bg); --module-chip: var(--gold-chip); }
    .module-services, .module-index, .module-retrieval { --module-color: var(--orange); --module-bg: var(--orange-bg); --module-chip: var(--orange-chip); }
    .module-review { --module-color: var(--green); --module-bg: var(--green-bg); --module-chip: var(--green-chip); }
    .group-neutral { --module-color: var(--grey); --module-bg: var(--grey-bg); --module-chip: var(--grey-chip); }
    .architecture .metric-value { font-size: 21px; font-weight: 700; }
    .architecture .metric-target { fill: var(--orange); font-weight: 700; }
    .architecture .module-name { fill: var(--module-color); }
    .architecture .body-text { fill: var(--ink); font-size: 12px; }
    .architecture .section-title { fill: var(--ink); font-size: 14px; font-weight: 700; }
    .architecture .outer-title { fill: var(--module-color); font-size: 24px; font-weight: 700; }
    .architecture .module-title { fill: var(--module-color); font-size: 21px; font-weight: 700; }
    .architecture .module-type { fill: var(--muted); font-size: 13px; }
    .architecture .module-note { fill: var(--muted); font-size: 14px; }
    .architecture .duty-title { font-size: 19px; font-weight: 700; }
    .architecture .duty-body { font-size: 15px; }
    .architecture .duty-accent { fill: none; stroke: var(--module-color); stroke-width: 3; }

    .architecture .boundary { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 7 5; }
    .architecture .frame { fill: var(--module-bg); stroke: var(--module-color); stroke-width: 1.5; rx: 10; }
    .architecture .card, .architecture .mini { fill: var(--panel); stroke: var(--module-color, var(--line)); stroke-width: 2; vector-effect: non-scaling-stroke; rx: 8; }
    .architecture .frame-inherited { fill: var(--panel); }
    .architecture .duty { fill: var(--module-chip); stroke: none; rx: 6; }
    .architecture .annotation { fill: var(--panel); stroke: var(--line); stroke-width: 1; rx: 8; }
    .architecture .card-tinted { fill: var(--module-bg); }
    .architecture .chip, .architecture .pill { fill: var(--module-chip, var(--neutral-chip)); stroke: var(--module-color, var(--line-strong)); stroke-width: 1; rx: 5; }
    .architecture .band { fill: var(--module-bg); stroke: var(--module-color); stroke-width: 1.5; rx: 10; }
    .architecture .step { fill: var(--ink); stroke: none; }
    .architecture .step-label { fill: var(--page); font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; }
    .architecture .node-title { font-size: 15px; font-weight: 700; }
    .architecture .frame-title { fill: var(--module-color); font-size: 14px; font-weight: 700; }
    .architecture .mini-title { font-size: 12.5px; font-weight: 700; }
    .architecture .boundary-title { font-size: 14px; font-weight: 700; }
    .architecture .band-title { fill: var(--module-color); font-size: 13.5px; font-weight: 700; }
    .architecture .note { fill: var(--muted); font-size: 12px; }
    .architecture .mono { font-family: var(--font-mono); font-size: 12px; }
    .architecture .chip-label { font-size: 11.5px; }
    .k-flow { --edge: var(--blue); --edge-width: 2; }
    .k-alt { --edge: var(--gold); --edge-width: 2; --edge-dash: 7 4; }
    .k-event { --edge: var(--teal); --edge-width: 1.8; --edge-dash: 2 4; }
    .k-plain { --edge: var(--line-strong); --edge-width: 1.6; }
    .k-cfg { --edge: var(--line-strong); --edge-width: 1.6; --edge-dash: 6 4; }
    .k-association { --edge: var(--line-strong); --edge-width: 1.4; --edge-dash: 3 4; }
    .k-fail { --edge: var(--red); --edge-width: 2; }
    .architecture .edge { fill: none; stroke: var(--edge, var(--line-strong)); stroke-width: var(--edge-width, 1.6); stroke-dasharray: var(--edge-dash, none); }
    .architecture .arrowhead { fill: var(--edge, var(--line-strong)); stroke: none; }
    .architecture .edge-label { fill: var(--muted); font-size: 11.5px; }
    .architecture .edge-label.k-flow, .architecture .edge-label.k-alt, .architecture .edge-label.k-event, .architecture .edge-label.k-fail { fill: var(--edge); }
    .architecture .edge-operation { font-size: 12.5px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="arch-document">
    <h1>多入口与能力适配（通用示例）</h1>
    <figure>
      <div class="diagram-scroll" tabindex="0" role="region" aria-label="系统图，可横向滚动">
        <svg xmlns="http://www.w3.org/2000/svg" class="architecture" viewBox="0 0 1400 764" role="img" aria-labelledby="sample-title" aria-describedby="sample-description">
          <title id="sample-title">多入口汇合、条件分支与异步回传</title>
          <desc id="sample-description">交互入口与批量入口汇合到任务编排。任务编排调用业务执行器，在需要扩展能力时调用能力适配器。能力适配器向编排组件回传事件，业务执行器向交互入口异步回传结果。业务执行器读取公共配置，能力适配器通过进程内的结果存储客户端写入结果。所有组件均为通用方法示例。</desc>
          <defs>
            <marker id="sample-arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead k-flow" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="sample-arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead k-alt" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="sample-arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead k-event" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="sample-arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead k-plain" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="sample-arrow-cfg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead k-cfg" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="sample-arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead k-fail" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
<rect class="boundary" x="20" y="20" width="1360" height="724" rx="10"/><text class="boundary-title" x="40" y="46">应用进程（示例）</text><g id="sample-orchestration" class="module-orchestration"><rect class="frame" x="70" y="188" width="1260" height="112"/><text class="frame-title" x="90" y="214">编排与协调</text></g>
<g id="sample-business" class="module-execution"><rect class="frame" x="70" y="352" width="600" height="172"/><text class="frame-title" x="90" y="378">核心业务与计算</text></g>
<g id="sample-tools" class="module-adapter"><rect class="frame" x="730" y="352" width="600" height="172"/><text class="frame-title" x="750" y="378">工具与能力适配</text></g>
<g id="sample-infrastructure" class="module-services"><rect class="frame" x="70" y="596" width="1260" height="116"/><text class="frame-title" x="90" y="624">公共基础设施</text></g>
<path id="sample-entry-interactive-flow" class="edge k-flow" d="M350,140 V164 H700"/>
<path id="sample-entry-batch-flow" class="edge k-flow" d="M1030,140 V164 H700"/>
<path id="sample-merged-request" class="edge k-flow" d="M700,164 V224" marker-end="url(#sample-arrow-flow)"/>
<text class="edge-label k-flow" x="718" y="180" data-edge-label="sample-merged-request">请求汇合</text><path id="sample-call-business" class="edge k-flow" d="M350,280 V388" marker-end="url(#sample-arrow-flow)"/>
<text class="edge-label k-flow" x="368" y="332" data-edge-label="sample-call-business">执行请求</text><path id="sample-call-tools" class="edge k-alt" d="M1030,280 V388" marker-end="url(#sample-arrow-alt)"/>
<text class="edge-label k-alt" x="1048" y="332" data-edge-label="sample-call-tools">需要扩展能力时</text><path id="sample-business-results" class="edge k-event" d="M90,442 H44 V102 H70" marker-end="url(#sample-arrow-event)"/>
<text class="edge-label k-event" x="60" y="178" data-edge-label="sample-business-results">结果回传</text><path id="sample-tool-events" class="edge k-event" d="M1310,442 H1354 V252 H1310" marker-end="url(#sample-arrow-event)"/>
<text class="edge-label k-event" x="1340" y="326" text-anchor="end" data-edge-label="sample-tool-events">事件回传</text><path id="sample-config-dependency" class="edge k-plain" d="M350,504 V560 H286 V640" marker-end="url(#sample-arrow-plain)"/>
<text class="edge-label edge-operation k-plain" x="368" y="546" data-edge-label="sample-config-dependency">读取通用配置</text>
<text class="edge-label k-plain" x="368" y="566" data-edge-label="sample-config-dependency">配置接口（只读）</text><path id="sample-storage-dependency" class="edge k-plain" d="M1030,504 V560 H1114 V640" marker-end="url(#sample-arrow-plain)"/>
<text class="edge-label k-plain" x="1130" y="574" data-edge-label="sample-storage-dependency">写入结果</text><g id="sample-interactive" class="module-entry"><rect class="card card-tinted" x="70" y="64" width="600" height="76"/><text class="node-title" x="86" y="90">交互入口</text><text class="body-text" x="86" y="112">接收请求，异步接收执行结果</text></g>
<g id="sample-batch" class="module-entry"><rect class="card card-tinted" x="730" y="64" width="600" height="76"/><text class="node-title" x="746" y="90">批量入口</text><text class="body-text" x="746" y="112">将批量任务交给同一编排组件</text></g>
<g id="sample-coordinator" class="module-orchestration"><rect class="card" x="90" y="224" width="1220" height="56"/><text class="node-title" x="106" y="258">任务编排</text><text class="body-text" x="310" y="258">选择执行路径，协调扩展能力</text></g>
<g id="sample-executor" class="module-execution"><rect class="card" x="90" y="388" width="560" height="116"/><text class="node-title" x="106" y="414">业务执行器</text><text class="body-text" x="106" y="436">执行核心业务计算</text><text class="body-text" x="106" y="457">执行状态由本组件持有</text><text class="body-text" x="106" y="480">性能信息：按请求统计耗时与峰值内存</text></g>
<g id="sample-adapter" class="module-adapter"><rect class="card" x="750" y="388" width="560" height="116"/><text class="node-title" x="766" y="414">能力适配器</text><text class="body-text" x="766" y="436">按条件调用所需工具</text></g>
<g id="sample-config" class="module-services"><rect class="mini" x="90" y="640" width="392" height="52"/><text class="mini-title" x="286" y="672" text-anchor="middle">通用配置</text></g>
<g id="sample-logging" class="module-services"><rect class="mini" x="504" y="640" width="392" height="52"/><text class="mini-title" x="700" y="672" text-anchor="middle">日志</text></g>
<g id="sample-storage" class="module-services"><rect class="mini" x="918" y="640" width="392" height="52"/><text class="mini-title" x="1114" y="672" text-anchor="middle">结果存储客户端</text></g>
</svg>
      </div>
      <figcaption>来源：内置通用示例，不描述真实项目。结果存储客户端位于进程内，持久化介质未展开；日志仅展示基础设施组成。</figcaption>
    </figure>
    <div class="legend" role="group" aria-label="图例">
<div class="legend-row module-entry"><span class="legend-symbol"><span class="legend-swatch"></span></span><span>公开能力（入口）</span></div>
<div class="legend-row module-orchestration"><span class="legend-symbol"><span class="legend-swatch"></span></span><span>编排与协调</span></div>
<div class="legend-row module-execution"><span class="legend-symbol"><span class="legend-swatch"></span></span><span>核心业务与计算</span></div>
<div class="legend-row module-adapter"><span class="legend-symbol"><span class="legend-swatch"></span></span><span>工具与能力适配</span></div>
<div class="legend-row module-services"><span class="legend-symbol"><span class="legend-swatch"></span></span><span>公共基础设施</span></div>
<div class="legend-row k-flow"><svg class="legend-symbol" width="52" height="18" viewBox="0 0 52 18" aria-hidden="true"><path class="legend-line" d="M0,9 H44"/><path class="legend-arrow" d="M44,5 L52,9 L44,13 Z"/></svg><span>主要调用</span></div>
<div class="legend-row k-alt"><svg class="legend-symbol" width="52" height="18" viewBox="0 0 52 18" aria-hidden="true"><path class="legend-line" d="M0,9 H44"/><path class="legend-arrow" d="M44,5 L52,9 L44,13 Z"/></svg><span>条件分支</span></div>
<div class="legend-row k-event"><svg class="legend-symbol" width="52" height="18" viewBox="0 0 52 18" aria-hidden="true"><path class="legend-line" d="M0,9 H44"/><path class="legend-arrow" d="M44,5 L52,9 L44,13 Z"/></svg><span>异步回传</span></div>
<div class="legend-row k-plain"><svg class="legend-symbol" width="52" height="18" viewBox="0 0 52 18" aria-hidden="true"><path class="legend-line" d="M0,9 H44"/><path class="legend-arrow" d="M44,5 L52,9 L44,13 Z"/></svg><span>组件依赖</span></div>
</div>
  </main>
</body>
</html>
