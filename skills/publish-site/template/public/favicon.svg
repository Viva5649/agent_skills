<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b88c" />
      <stop offset="100%" stop-color="#a08560" />
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="6" fill="#0c0c0c" />
  <!-- Decorative top accent line -->
  <rect x="4" y="4" width="24" height="1.2" rx="0.6" fill="url(#g)" opacity="0.9" />
  <!-- "V" text in serif style -->
  <text x="16" y="22.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
    font-weight="700" font-size="15" fill="url(#g)" letter-spacing="-0.5">V</text>
  <!-- Subtle bottom line -->
  <rect x="8" y="26" width="16" height="0.8" rx="0.4" fill="#c8a97e" opacity="0.3" />
</svg>
